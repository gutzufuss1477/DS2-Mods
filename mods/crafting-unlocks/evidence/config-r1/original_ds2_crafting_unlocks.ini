; DS2 Crafting Unlocks 0.1.0-alpha
; Experimental: normal fabrication path only. Not an all-category release.
; Restart the game after changing this file. No hot reload.

[CraftingUnlocks]
Enabled=1

; 1 = early-unlock every supported, validated recipe at a suitable terminal.
; 0 = early-unlock only recipes explicitly set to 1 in [Items].
DefaultUnlock=1

; Export real loaded catalogue keys + in-game names on first fabrication menu.
; Writes ds2_crafting_catalogue.tsv and ds2_crafting_items.generated.ini.
; These generated files are NOT read as configuration.
ExportCatalogue=1

[Items]
; Copy desired entries from ds2_crafting_items.generated.ini into this section.
; Keep each recipe key only once.
; Values: inherit = DefaultUnlock, 0 = native progression, 1 = early unlock.
; A value of 0 NEVER locks an item that the game already unlocked normally.
; Entries for unsupported/DLC-special/mission-specific resources stay native.
; No invented example recipe IDs are included.
