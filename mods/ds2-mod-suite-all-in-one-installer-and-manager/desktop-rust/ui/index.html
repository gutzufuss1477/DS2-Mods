<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DS2 Mod Suite</title><link rel="stylesheet" href="style.css"><script defer src="data.js"></script><script defer src="app.js"></script></head>
<body>
<header><div class="brand"><span class="symbol">DS2</span><div><h1>Mod Suite</h1><p id="subtitle"></p></div></div><div class="header-right"><span class="preview" id="version">1.14.0</span><select id="language" aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option><option value="zh-CN">简体中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="pt-BR">Português (Brasil)</option><option value="ru">Русский</option></select></div></header>
<section class="gamebar"><div><span class="eyebrow" data-t="Game folder">Game folder</span><div id="game-path"></div><span id="game-status"></span></div><div class="actions"><button id="rescan" data-t="Rescan">Rescan</button><button id="browse" data-t="Browse…">Browse…</button></div></section>
<div id="message" role="status" aria-live="polite" hidden></div>
<main><aside><div class="section-head"><h2 data-t="Mods">Mods</h2><span id="mod-count"></span></div><input id="search" type="search" aria-label="Search mods" placeholder="Search mods"><div class="selection-actions"><button id="select-none" data-t="Select none">Select none</button><span id="selected-count"></span></div><div id="mod-list"></div></aside>
<section class="settings"><div class="settings-head"><div><p class="eyebrow" data-t="Mod Settings">Mod Settings</p><h2 id="mod-title"></h2><p id="mod-description"></p></div><button id="reset" data-t="Reset to defaults">Reset to defaults</button></div><div class="settings-toolbar"><input id="settings-search" type="search" aria-label="Search settings" placeholder="Search settings"><label><input type="checkbox" id="advanced"><span data-t="Show advanced settings">Show advanced settings</span></label></div><div id="fields"></div></section></main>
<footer><div><span class="backup-dot"></span><span data-t="Backups enabled">Backups enabled</span><button id="restore">Restore backup</button><button id="import-profile">Import profile</button><button id="export-profile">Export profile</button></div><div class="actions"><span id="busy" hidden></span><button id="apply" class="primary" data-t="Apply changes">Apply changes</button></div></footer>
<dialog id="review"><h2 data-t="Apply changes">Apply changes</h2><p data-t="Choose your mods. Backup, installation and verification run automatically."></p><ul id="plan-list"></ul><div class="dialog-actions"><button id="cancel" data-t="Cancel">Cancel</button><button id="confirm" class="primary" data-t="Apply changes">Apply changes</button></div></dialog>
</body></html>
