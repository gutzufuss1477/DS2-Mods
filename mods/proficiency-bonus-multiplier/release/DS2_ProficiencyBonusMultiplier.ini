; DS2 Proficiency Bonus Multiplier v1.0.0
; Target: DEATH STRANDING 2: ON THE BEACH - DS2.exe 1.10.89.0
;
; HOW MULTIPLIERS WORK
; 1.0 = vanilla bonus strength (no change)
; 2.0 = double the vanilla bonus strength
; 0.5 = half the vanilla bonus strength
; 0.0 = remove the supported level-dependent bonus
;
; Values are limited internally to 0.0 - 10.0.
; The mod is applied once after the proficiency data has loaded.
; Restart the game after changing this file.
;
; IMPORTANT
; Level1Multiplier .. Level5Multiplier modify the bonus TABLE for that level.
; They do NOT unlock levels and they do NOT change proficiency gain/XP.
; Sam only receives the gameplay bonus of his currently unlocked proficiency level.
;
; SAFETY
; Reduction-type factors (for example firearm recoil/reticle reductions) are
; clamped at 0.0 by default. This prevents values below -100% from becoming
; negative internal multipliers. Leave this enabled for normal use.

[Safety]
ClampReductionFactorsAtZero=1

; Traversal proficiency - supported level-dependent rows.
[TerrainTraversal]
Enabled=1
Level1Multiplier=1.0
Level2Multiplier=1.0
Level3Multiplier=1.0
Level4Multiplier=1.0
Level5Multiplier=1.0

