[ClimbingGlovesRange]
; Master switch. Set to 0 to leave all resource values unchanged.
Enabled=1

; Cargo pickup for Climbing and Combat Gloves Level 1, accepted range 8-100 m.
Level1RangeMeters=30

; Cargo pickup for Climbing and Combat Gloves Level 2, accepted range 10-100 m.
; Must be greater than or equal to Level1RangeMeters.
Level2RangeMeters=50

; Set to 1 for additional diagnostics in ds2_climbing_gloves_range.log.
; Critical errors are always logged.
DebugLog=0

[CombatGloves]
; Adds the magnetic cargo-pickup action to Combat Power Gloves.
; Uses the Level 1 and Level 2 pickup ranges above.
EnableCargoPickup=1
