; ============================================================================
; DS2 Sam Overhaul v1.1.0-dev.19 (development build)
; DEATH STRANDING 2: ON THE BEACH - Steam PC 1.10.89.0
; ============================================================================
;
; 0 = OFF, 1 = ON
; Percentage values: 100 = vanilla
; Time values are seconds
; Restart the game after changing this file
;

[CargoVisibility]
; Hide cargo attached to Sam's shoulders.
HideShoulderCargo=1

; Hide cargo attached to Sam's hips.
HideHipCargo=1

; Hide cargo stacked on Sam's backpack.
HideBackpackCargo=1

; Hide spare shoes carried on the shoe clip.
; Shoes Sam is currently wearing remain visible.
HideSpareShoes=1


[Movement]
; Allow jumping/dismounting from the monorail beyond the vanilla final blocker.
JumpFromMonorailAnywhere=1

; Allow the normal zipline dismount in more positions.
JumpFromZiplineAnywhere=1

; Allow normal qualifying landing rolls while wearing the backpack/cargo.
LandingRollWithBackpack=1


[Footprints]
; Hide normal ground footprints AND footprints highlighted by the Odradek scan.
; 0 = vanilla (default), 1 = hide. Optional; old INIs default to 0.
; Applies to new footprints and saved footprints rebuilt when loading a save.
; Restart the game after changing this option. No ReShade required.
HideFootprints=0


[GeneratorRange]
; Development preview: scales the generator charging trigger and matching visible ring.
; OFF by default until tested in-game. Restart DS2 after changing.
Enabled=0
; 100 = vanilla; 200 = twice the original radius. Accepted values 100 - 400.
RangePercent=200


[TimefallShelterRange]
; Optional German shelter-rest prompt correction (preserves actual native
; shelter resting action, changes only its label to "Verschnaufen").
; Default is 1 when shelter expansion is enabled; use 0 to retain vanilla text.
FixRestPrompt=1

; Native cargo-coating restoration radius, independently of visible shelter
; circle and timefall protection. 215% = 8.6m, while RangePercent=200 = 8m.
; Slight excess compensates 3D distance checks on sloping terrain.
; Accepted values 100 - 400. Set 200 for exact same nominal radius as circle.
RepairRadiusPercent=215

; Optional expensive developer spatial snapshots. Default off; native
; performance counters remain on for verifying the fast steady-state path.
SpatialDiagnostics=0
; Rain protection and visible circle follow RangePercent; native cargo repair
; follows RepairRadiusPercent independently to compensate sloping terrain.
; dev23: validated ACTIVE shelter RepairSpray sources bypass the old contact gate;
; original native per-cargo 3D range and repair amount remain in force.
; 200% radius alignment was confirmed in-game on 2026-10-09.
Enabled=0
; 100 = vanilla; 200 = twice the original radius. Accepted values 100 - 400.
RangePercent=200


[AutoDrive]
; Time before Autodrive becomes ready after native road eligibility is met.
; 0.5 - 5.0 seconds. 5.0 = vanilla. Recommended: 2.0.
ActivationSeconds=2.0


[TruckHeavyMachineGun]
Enabled=1

; 100 - 300. Recommended: 175.
