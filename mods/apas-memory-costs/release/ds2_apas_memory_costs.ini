; DS2 APAS Memory Costs v1.0.0
; Restart the game after changing this file.

[APASMemoryCosts]
Enabled=1

; APAS Memory cost applied to every loaded APAS Enhancement.
; 0 = free
; 1 = every enhancement costs 1 point
; Valid range: 0..1000000
GlobalCost=1

; 0 = no normal runtime log
; 1 = create/update ds2_apas_memory_costs.log with patch details
DebugLog=0
