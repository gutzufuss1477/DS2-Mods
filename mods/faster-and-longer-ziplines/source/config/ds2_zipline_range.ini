[ZiplineRange]
Enabled=1

; Nominal connection distance in metres. DS2's native +1 m placement
; tolerance is added internally, matching the original 300/350 m behavior.
; Allowed range: Level 1 = 300-1000, Level 2 = 350-1000.
; Both defaults are identical, so Level 1 already has the full configured
; reach and upgrading is not required just to obtain more range.
; The mod also raises the Zipline realization and HUD/selection distances
; so the remote endpoint stays active and visible at the selected maximum.
Level1RangeMeters=600
Level2RangeMeters=600

; Multiplies the actual travel progress along the cable for normal rides and
; rides with one/two carriers or ADS. 1.0 = native, 2.0 = double speed.
; Allowed range: 0.25-10.0. Values above 4.0 are available for advanced use
; but may make world streaming or endpoint arrival less comfortable.
; Restart the game after changing this value.
SpeedMultiplier=2.0

; Optional diagnostic log next to the ASI. Errors are always logged.
DebugLog=0
