[OdradekScan]
; 0 disables all mod changes. Restart DS2 after changing this file.
Enabled=1

; Scan radius in metres (50-1000). The wave expands at native speed.
; Includes usable previously carried cargo dropped into the world after a fresh scan.
RangeMeters=500

; Keep the native wave appearance (tested with the default 500 m range).
; Optional visual-only multiplier, 0.25-1. Default/missing=1.
; Does not change detection, HUD radius or native scan timing. Restart required.
VisualWaveScale=1

; Horizontal full-circle ground scan.
FullCircle=1
FullCircleMode=Sphere

; Extend candidate permission AND downstream display radius for recently scanned cargo.
; Only current eligible cargo IDs qualify; global marker ranges remain native.
; Keeps native hit timing, expiry and HUD budgets; no forced loading or replay.
; Also extends verified cargo's optional sensor cap. Used/destroyed cargo stays vanilla.
; Sphere terrain scan variants are normalized to the configured detection radius.
ExtendCargoMarkers=1

; Optional diagnostic log. Enable only when troubleshooting.
DebugLog=0
