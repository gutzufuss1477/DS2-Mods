; DS2 APAS Memory Costs 3.0.0 - one ASI for all features.
; Restart the game after every change. Do not load older APAS ASIs alongside it.
; Supports Steam DS2.exe 1.10.89.0 only.

[APASMemoryCosts]
; 1 = change costs; 0 = keep vanilla costs (UnlockAll remains independent).
Enabled=1
; Exact cost for normally paid enhancements: 0 = free, 1 = one point.
; Allowed range: 0..1000000. Base nodes and natively free nodes keep vanilla costs.
GlobalCost=1

[APASUnlocks]
; 0 = normal APAS progression (default).
; 1 = bypass APAS prerequisites once the game's APAS system is available.
; This unlocks nodes; it does not automatically activate/equip them.
; BACK UP YOUR SAVE before enabling this. Saved unlocks may persist:
; setting 0 later or removing the ASI does NOT relock saved enhancements.
UnlockAll=0

; 1 = expose APAS in the Ring Device before its normal story unlock.
; Only the APAS menu story gate is bypassed; special Ring restrictions stay vanilla.
; With UnlockAll=1, available APAS resources are located through the native APAS path.
; No global story/facility facts are written. Located nodes may persist in the save.
EarlyAccess=0
