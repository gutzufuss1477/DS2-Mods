; DS2 APAS Memory Costs - Unlock All v1.1.0
; DS2 Mod Suite defaults: optional Unlock All is OFF.
; Do not install together with the normal APAS Memory Costs ASI.
; Restart the game after changing this file.

[APASMemoryCosts]
Enabled=1

; APAS Memory cost applied to all loaded APAS Enhancements.
; 0 = free
; 1 = one APAS Memory point per enhancement
; Valid range: 0..1000000
GlobalCost=1

[APASUnlocks]
; Optional: bypasses APAS progression; unlocks may persist in the save.
; Back up your save before enabling. Turning this off does not undo saved unlocks.
; 1 = unlock all valid APAS Enhancements through the game's native APAS unlock path
; 0 = do not bypass APAS unlock requirements
UnlockAll=0
